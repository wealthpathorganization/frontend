# Frontend Build and Push Workflow
# Builds and pushes Docker images to GitHub Container Registry

name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/wealthpathorganization/frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm test -- --passWithNoTests

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_BASE_URL=

  notify-deploy:
    name: Trigger Auto-Deploy
    runs-on: ubuntu-latest
    needs: build
    if: success()
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:
      - name: Log build info
        run: |
          echo "=== Frontend Build Complete ==="
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "==============================="

      - name: Trigger deployment
        if: env.DEPLOY_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository: wealthpathorganization/infra-ansible
          event-type: deploy
          client-payload: |
            {
              "source": "frontend",
              "sha": "${{ github.sha }}",
              "frontend_tag": "${{ github.sha }}"
            }

      - name: Skip deploy notification
        if: env.DEPLOY_TOKEN == ''
        run: |
          echo "⚠️ DEPLOY_TOKEN not set, skipping auto-deploy"
          echo "To enable auto-deploy, add DEPLOY_TOKEN secret to this repository"

